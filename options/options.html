<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Copilot — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --bg2: #16213e;
      --border: #2a2a4a;
      --accent: #e94560;
      --text: #e0e0e0;
      --text-muted: #888;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 span.logo { color: var(--accent); }

    .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--text);
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: var(--accent);
    }

    .hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .hint a {
      color: var(--accent);
      text-decoration: none;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      transition: background 0.15s;
    }

    button:hover { background: #c73652; }

    #status {
      font-size: 13px;
      padding: 4px 0;
    }

    #status.success { color: #4caf78; }
    #status.error   { color: #ff8899; }

    .show-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
    }

    .show-toggle:hover {
      background: var(--border);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span class="logo">✦</span> Gemini Copilot Settings</h1>
    <p class="subtitle">Configure your Gemini API key to enable AI responses.</p>

    <div class="field">
      <label for="api-key-input">Gemini API Key</label>
      <input type="password" id="api-key-input" placeholder="AIza..." autocomplete="off" spellcheck="false" />
      <button class="show-toggle" id="toggle-visibility">Show key</button>
      <p class="hint">
        Get a free API key at
        <a href="https://aistudio.google.com/app/apikey" target="_blank">aistudio.google.com</a>.
        Your key is stored locally and only sent to Google's Gemini API.
      </p>
    </div>

    <div class="actions">
      <button id="btn-save">Save</button>
      <span id="status"></span>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
