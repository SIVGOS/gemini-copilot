<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Copilot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header>
      <div id="header-left">
        <span class="logo">✦</span>
        <span class="title">Gemini Copilot</span>
      </div>
      <div id="header-right">
        <button id="btn-clear" title="Clear chat">↺</button>
        <button id="btn-options" title="Settings">⚙</button>
      </div>
    </header>

    <div id="page-context-bar">
      <span id="page-title-display">Loading page info...</span>
    </div>

    <div id="messages"></div>

    <div id="input-area">
      <textarea
        id="user-input"
        placeholder="Ask anything about this page..."
        rows="2"
        autofocus
      ></textarea>
      <button id="btn-send" title="Send (Enter)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>
  <script src="marked.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
